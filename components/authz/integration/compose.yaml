services:
  redis:
    image: redis:7.4-alpine
    pull_policy: never
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 60
  cluster:
    image: redis:7.4-alpine
    pull_policy: never
    ports:
      - "127.0.0.1::7000"
      - "127.0.0.1::7001"
      - "127.0.0.1::7002"
    command:
      - sh
      - -ec
      - |
        for port in 7000 7001 7002; do
          mkdir -p /tmp/redis-$$port
          redis-server --port $$port --bind 0.0.0.0 --protected-mode no \
            --cluster-enabled yes --cluster-config-file /tmp/redis-$$port/nodes.conf \
            --dir /tmp/redis-$$port --appendonly no --save "" &
        done
        until redis-cli -p 7002 ping; do sleep 1; done
        redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
          --cluster-replicas 0 --cluster-yes
        wait
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 cluster info | grep -q 'cluster_state:ok'"]
      interval: 1s
      timeout: 2s
      retries: 60
  mysql:
    image: mysql:8.4
    pull_policy: never
    environment:
      MYSQL_ROOT_PASSWORD: authz-integration-only
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: authz_test
    ports: ["127.0.0.1::3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -e 'SELECT 1' authz_test"]
      interval: 2s
      timeout: 3s
      retries: 90
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_PASSWORD: authz-integration-only
      POSTGRES_DB: authz_test
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "authz_test"]
      interval: 1s
      timeout: 2s
      retries: 60
