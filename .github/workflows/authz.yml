name: Authz
on:
  push:
    paths: ['components/authz/**', 'components/ginx/**', 'scripts/test-authz.sh', 'Makefile', '.github/workflows/authz.yml']
  pull_request:
    paths: ['components/authz/**', 'components/ginx/**', 'scripts/test-authz.sh', 'Makefile', '.github/workflows/authz.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            components/authz/go.sum
            components/ginx/go.sum
      - run: make test-authz
